# ClayPipe — fidelity scoring weights and thresholds (SPEC §3; Rule 25).
# The FORMULA is fixed in code:
#   F = w.ssim*SSIM + w.lpips_edges*(1 - LPIPS_edges) + w.id*ID + w.tf*TF
# The WEIGHTS are per-project tuning and live here. Weights must sum to 1.0;
# config validation rejects anything else at startup.
#
# NOTE: consumed by the scoring module, which lands in Build Order step 2.
# Step 1 only validates this file — it does not score.
version: 1

weights:
  ssim: 0.40
  lpips_edges: 0.25
  id: 0.20
  tf: 0.15

# Per-component targets (SPEC §3). These are GATING, not merely diagnostic —
# see thresholds.require_component_targets below.
targets:
  ssim_min: 0.72
  lpips_edges_max: 0.35
  id_min: 0.85
  # DECISION 2 (2026-09-09), memory.md D14: raised 0.80 -> 0.95.
  # TF is a whole-frame mean and saturates near 1, so 0.80 was unbreachable:
  # measured static 0.997, real motion 0.932, severe shimmer 0.916 — every one
  # of them "met" the old target, including the shimmer it existed to catch.
  # At 0.95 the ordering static > real-motion > flicker becomes expressive.
  # The METRIC is unchanged; only this number moved.
  tf_min: 0.95

# Composite verdict bands (SPEC §3).
#
# DECISION 1 (2026-09-09), memory.md D13 — PASS now requires BOTH:
#     F >= pass  AND  every component target above is met.
#
# THE GATE RUNS IN THIS ORDER, and the order is the whole point:
#
#   0. FAIL IS A COMPOSITE-ONLY VETO, settled first: F < borderline -> FAIL
#      (reason: composite_fail) -> retry with a new seed, max 2, then human.
#      A component miss must never be the thing that FAILs a frame, so this
#      case is decided before the target check runs.
#   1. COMPONENT TARGETS next, one by one. Any miss -> BORDERLINE
#      (reason: targets_missed) -> one retry at strength -0.10, then the
#      human queue. When a frame both misses a target and sits below the pass
#      line, targets_missed is the reason reported: it is the more actionable
#      diagnosis of the two.
#   2. COMPOSITE F last. borderline <= F < pass -> BORDERLINE
#      (reason: composite_borderline).
#
# So the ONLY route to FAIL is the composite. A missed component target can
# push a frame to BORDERLINE but never past it.
#
# Why: without this, no single component at its worst value could pull F out
# of PASS except SSIM (ID=0 -> F=0.80, TF=0 -> F=0.85, LPIPS=1 -> F=0.75), so
# failure modes 2 and 3 were not gated at all. structure_destroyed scored PASS
# at F=0.814 with ID=0.653 against a 0.85 target. The formula is untouched.
thresholds:
  pass: 0.75        # F >= pass AND all targets met -> auto-accept
  borderline: 0.65  # borderline <= F < pass -> retry once at strength -0.10
                    # F < borderline         -> retry with a new seed
  # Decision 1. Setting this false restores pre-2026-09-09 behaviour, where the
  # composite alone decided and component targets were advisory.
  require_component_targets: true

# Canny edge extraction. LPIPS is measured on THESE maps, never on raw colour:
# a correct restyle SHOULD change colour and texture, and only geometry is
# allowed to be graded. Tuning these changes what "geometry" means.
canny:
  blur_kernel: 5      # Gaussian pre-blur, odd; suppresses texture-level edges
  low_threshold: 100
  high_threshold: 200

# Farneback optical flow, for temporal fidelity between consecutive restyled
# frames. Defaults are OpenCV's documented values.
temporal:
  # How the motion-compensated residual is reduced to one number (D34).
  #   block_p95  median of per-4x4-block 95th percentiles. THE DEFAULT.
  #   p95        95th percentile of the whole residual. Opt-in only — measured
  #              WORSE than mean: real motion's occlusion edges live exactly at
  #              the high percentile, so high_motion scored 0.561 against
  #              flicker's 0.812, inverting the ordering the metric exists for.
  #   mean       whole-frame mean. The pre-D34 behaviour; saturates near 1 and
  #              cannot clear tf_min on legitimate fast motion (that was D15).
  aggregation: "block_p95"
  block_size: 4
  pyr_scale: 0.5
  levels: 3
  winsize: 15
  iterations: 3
  poly_n: 5
  poly_sigma: 1.2

# Model choices for the two learned metrics. Weights are downloaded once and
# cached; scoring never downloads mid-run.
models:
  lpips_net: alex             # lpips backbone: alex | vgg | squeeze
  # `-quickgelu` is REQUIRED with the openai checkpoint: those weights were
  # trained with QuickGELU activations, and open_clip warns (but proceeds) if
  # you pair them with a plain-GELU architecture, silently producing embeddings
  # the checkpoint was never trained to emit.
  identity_model: ViT-B-32-quickgelu
  identity_pretrained: openai # open_clip checkpoint tag

# --------------------------------------------------------------------------
# Cost firewalls (SPEC §4, brief §7). These are hard circuit-breakers, not
# warnings: every one of them halts the run and writes an incident note.
# --------------------------------------------------------------------------
firewalls:
  # Per-frame retry cap. A frame that has burned this many retries goes to the
  # human queue rather than being retried a third time.
  max_retries_per_frame: 2

  # Whole-run retry budget, as a fraction of frame count. A clip needing more
  # retries than this has a systemic prompt problem, not frame problems, and
  # throwing more API money at it is the exact failure pattern being designed
  # out. Breach pauses the run and waits for a human.
  total_retry_budget_fraction: 0.15

  # Applied to a BORDERLINE frame's first retry (SPEC §3).
  borderline_strength_delta: -0.10

  # Kill switch: never discover a bad run at frame 700.
  kill_switch:
    after_frames: 50
    min_mean_f: 0.70

  cost:
    # Estimated USD per restyle call, per backend. Charged to the ledger BEFORE
    # the call is made, then reconciled with the actual afterwards.
    estimated_usd_per_call:
      dummy: 0.0
      fal: 0.035
    # Hard caps. null = uncapped. `--max-cost-usd` overrides the run cap.
    # The PROJECT cap is SPEC Addendum A3: the per-run cap alone does not stop
    # ten aborted runs at $19 each costing $190.
    max_cost_usd_run: null
    max_cost_usd_project: null

  # fal.ai endpoint selection. Flux Kontext is operator-pinned over
  # SDXL+ControlNet (SPEC Addendum A2): it preserves structure better in one
  # shot, and structure is what the whole scoring stack grades.
  fal:
    model: "fal-ai/flux-pro/kontext"

# --------------------------------------------------------------------------
# Human review pages (SPEC §5). Self-contained HTML, opened via `webbrowser`,
# no web server. These are thresholds, so they live here and not in code.
# --------------------------------------------------------------------------
review:
  # Frames at or below this F land on the flag page as outliers. Defaults to
  # the pass threshold: anything that did not auto-accept deserves human eyes.
  outlier_f_threshold: 0.75
  # SPEC §5: a random audit sample of frames that DID pass, so a run cannot be
  # rubber-stamped by a scorer that is quietly mis-calibrated.
  audit_sample_fraction: 0.02
  # Deterministic sampling: the same run always yields the same audit set, so a
  # review can be reproduced and a second reviewer sees the same cards.
  audit_sample_seed: 20260909
  # A review page beyond this many cards stops being reviewable. Hitting the cap
  # is itself a finding: an incident note is written with the true count rather
  # than the excess being silently dropped.
  max_outlier_cards: 200
  # How long `poll_canary_verdict` waits for a human before giving up.
  canary_timeout_s: 600
  canary_poll_s: 1.0
