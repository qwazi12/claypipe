# ClayPipe — fidelity scoring weights and thresholds (SPEC §3; Rule 25).
# The FORMULA is fixed in code:
#   F = w.ssim*SSIM + w.lpips_edges*(1 - LPIPS_edges) + w.id*ID + w.tf*TF
# The WEIGHTS are per-project tuning and live here. Weights must sum to 1.0;
# config validation rejects anything else at startup.
#
# NOTE: consumed by the scoring module, which lands in Build Order step 2.
# Step 1 only validates this file — it does not score.
version: 1

weights:
  ssim: 0.40
  lpips_edges: 0.25
  id: 0.20
  tf: 0.15

# Per-component targets (SPEC §3). These are GATING, not merely diagnostic —
# see thresholds.require_component_targets below.
targets:
  ssim_min: 0.72
  lpips_edges_max: 0.35
  id_min: 0.85
  # DECISION 2 (2026-09-09), memory.md D14: raised 0.80 -> 0.95.
  # TF is a whole-frame mean and saturates near 1, so 0.80 was unbreachable:
  # measured static 0.997, real motion 0.932, severe shimmer 0.916 — every one
  # of them "met" the old target, including the shimmer it existed to catch.
  # At 0.95 the ordering static > real-motion > flicker becomes expressive.
  # The METRIC is unchanged; only this number moved.
  tf_min: 0.95

# Composite verdict bands (SPEC §3).
#
# DECISION 1 (2026-09-09), memory.md D13 — PASS now requires BOTH:
#     F >= pass  AND  every component target above is met.
#
# THE GATE RUNS IN THIS ORDER, and the order is the whole point:
#
#   0. FAIL IS A COMPOSITE-ONLY VETO, settled first: F < borderline -> FAIL
#      (reason: composite_fail) -> retry with a new seed, max 2, then human.
#      A component miss must never be the thing that FAILs a frame, so this
#      case is decided before the target check runs.
#   1. COMPONENT TARGETS next, one by one. Any miss -> BORDERLINE
#      (reason: targets_missed) -> one retry at strength -0.10, then the
#      human queue. When a frame both misses a target and sits below the pass
#      line, targets_missed is the reason reported: it is the more actionable
#      diagnosis of the two.
#   2. COMPOSITE F last. borderline <= F < pass -> BORDERLINE
#      (reason: composite_borderline).
#
# So the ONLY route to FAIL is the composite. A missed component target can
# push a frame to BORDERLINE but never past it.
#
# Why: without this, no single component at its worst value could pull F out
# of PASS except SSIM (ID=0 -> F=0.80, TF=0 -> F=0.85, LPIPS=1 -> F=0.75), so
# failure modes 2 and 3 were not gated at all. structure_destroyed scored PASS
# at F=0.814 with ID=0.653 against a 0.85 target. The formula is untouched.
thresholds:
  pass: 0.75        # F >= pass AND all targets met -> auto-accept
  borderline: 0.65  # borderline <= F < pass -> retry once at strength -0.10
                    # F < borderline         -> retry with a new seed
  # Decision 1. Setting this false restores pre-2026-09-09 behaviour, where the
  # composite alone decided and component targets were advisory.
  require_component_targets: true

# Canny edge extraction. LPIPS is measured on THESE maps, never on raw colour:
# a correct restyle SHOULD change colour and texture, and only geometry is
# allowed to be graded. Tuning these changes what "geometry" means.
canny:
  blur_kernel: 5      # Gaussian pre-blur, odd; suppresses texture-level edges
  low_threshold: 100
  high_threshold: 200

# Farneback optical flow, for temporal fidelity between consecutive restyled
# frames. Defaults are OpenCV's documented values.
temporal:
  # How the motion-compensated residual is reduced to one number (D34).
  #   block_p95  median of per-4x4-block 95th percentiles. THE DEFAULT.
  #   p95        95th percentile of the whole residual. Opt-in only — measured
  #              WORSE than mean: real motion's occlusion edges live exactly at
  #              the high percentile, so high_motion scored 0.561 against
  #              flicker's 0.812, inverting the ordering the metric exists for.
  #   mean       whole-frame mean. The pre-D34 behaviour; saturates near 1 and
  #              cannot clear tf_min on legitimate fast motion (that was D15).
  aggregation: "block_p95"
  block_size: 4
  pyr_scale: 0.5
  levels: 3
  winsize: 15
  iterations: 3
  poly_n: 5
  poly_sigma: 1.2

# Model choices for the two learned metrics. Weights are downloaded once and
# cached; scoring never downloads mid-run.
models:
  lpips_net: alex             # lpips backbone: alex | vgg | squeeze
  # `-quickgelu` is REQUIRED with the openai checkpoint: those weights were
  # trained with QuickGELU activations, and open_clip warns (but proceeds) if
  # you pair them with a plain-GELU architecture, silently producing embeddings
  # the checkpoint was never trained to emit.
  identity_model: ViT-B-32-quickgelu
  identity_pretrained: openai # open_clip checkpoint tag

# --------------------------------------------------------------------------
# Cost firewalls (SPEC §4, brief §7). These are hard circuit-breakers, not
# warnings: every one of them halts the run and writes an incident note.
# --------------------------------------------------------------------------
firewalls:
  # Per-frame retry cap. A frame that has burned this many retries goes to the
  # human queue rather than being retried a third time.
  max_retries_per_frame: 2

  # Whole-run retry budget, as a fraction of frame count. A clip needing more
  # retries than this has a systemic prompt problem, not frame problems, and
  # throwing more API money at it is the exact failure pattern being designed
  # out. Breach pauses the run and waits for a human.
  total_retry_budget_fraction: 0.15

  # Applied to a BORDERLINE frame's first retry (SPEC §3).
  borderline_strength_delta: -0.10

  # Kill switch: never discover a bad run at frame 700.
  kill_switch:
    after_frames: 50
    min_mean_f: 0.70

  cost:
    # Estimated USD per restyle call, per backend. Charged to the ledger BEFORE
    # the call is made, then reconciled with the actual afterwards.
    #
    # This map is the per-IMAGE shorthand. A backend that bills per megapixel
    # or per video-second needs a `pricing` entry below instead — see T15.
    estimated_usd_per_call:
      dummy: 0.0
      # VERIFIED on fal's model page 2026-09-15: "Your request will cost $0.04
      # per image." Was 0.035, which is UNDER the real price — and because the
      # configured estimate is a CEILING (FalBackend.assert_affordable), an
      # under-stated price makes the firewall refuse every real call.
      fal: 0.04

    # T15/F3 — WHAT a backend charges for, not just how much. A flat per-call
    # number silently mis-prices two thirds of the candidate backends, giving a
    # ledger that reconciles to the wrong figure and spend caps that do not
    # bind. Prices researched 2026-09-14; VERIFY IN CONSOLE before a batch,
    # several are promotional.
    #
    # `round_up_to_mp: true` is fal's actual billing rule, and it inverts an
    # optimisation: fal rounds UP to the next whole megapixel, so 640x640
    # (0.41MP) pays the 1MP rate. On a hosted per-MP backend the cheap move is
    # to render LARGE; on self-hosted GPU, cost is roughly linear in pixels, so
    # the cheap move is to render SMALL. Render geometry therefore cannot be a
    # fixed aesthetic constant.
    pricing:
      dummy:
        unit: image
        rate: 0.0
      # The offline Track C stand-in. Priced as a per-video-second backend at
      # zero, so the whole clip path — including the unit-aware ledger — is
      # exercised at no cost. Listing it is not a formality: an unpriced
      # backend is refused outright, so an unlisted dummy_clip would make the
      # entire Track C path untestable.
      dummy_clip:
        # Mirrors VACE's unit, not just its price. A stand-in that billed
        # wall-clock while the real backend bills frames/16 would exercise the
        # wrong ledger path and hide the 2x error in tests.
        unit: frames_div_16
        rate: 0.0
      # --- T16 CANDIDATES, ALL PRICES VERIFIED ON fal's MODEL PAGES 2026-09-15.
      # Each entry names the endpoint it was read from, so a future session can
      # re-check one line rather than re-researching the table.

      # fal-ai/flux-pro/kontext -- "Your request will cost $0.04 per image."
      # The incumbent, and the most expensive realistic option: $28.80 per 60s
      # clip at 12fps without propagation.
      fal:
        unit: image
        rate: 0.04

      # fal-ai/flux-kontext/dev -- "$0.025 per megapixel" AND "Images are
      # billed by rounding up to the nearest megapixel." The round-up is
      # CONFIRMED wording, not an assumption.
      fal_kontext_dev:
        unit: megapixel
        rate: 0.025
        round_up_to_mp: true

      # fal-ai/qwen-image-edit -- "$0.03 per megapixel". Rounding is NOT stated
      # on the page; round_up_to_mp is left true as the conservative choice,
      # because over-estimating a ceiling refuses a call while under-estimating
      # one lets spend through unnoticed.
      fal_qwen_image_edit:
        unit: megapixel
        rate: 0.03
        round_up_to_mp: true

      # fal-ai/flux-general/image-to-image -- "$0.075 per megapixel", rounds up.
      # The ONLY fal endpoint that takes BOTH `controlnets` and `loras` (by
      # URL), so it is the sole candidate that can test structure-conditioning
      # plus a claymation LoRA together. Three times Kontext [dev]'s rate, which
      # changes the bake-off budget — see memory.md D53.
      fal_flux_general:
        unit: megapixel
        rate: 0.075
        round_up_to_mp: true

      # fal-ai/wan-vace-14b -- THE v2v BACKEND. Verified 2026-09-16 on the
      # model page AND its llms.txt, both stating verbatim: "Video seconds are
      # calculated at 16 frames per second."
      #
      # So the unit is frames_div_16, NOT wall-clock video_second. That
      # distinction is a 2x cost swing: a 60s clip at our 12fps cadence is 720
      # frames, billing 720/16 = 45 seconds ($1.80 at 480p) rather than 60
      # ($2.40). num_frames is constrained to 81-241 inclusive, so the smallest
      # purchasable request is 81 frames = 5.0625 billed seconds = $0.2025.
      wan_vace_480p:
        unit: frames_div_16
        rate: 0.04
      wan_vace_580p:
        unit: frames_div_16
        rate: 0.06
      wan_vace_720p:
        unit: frames_div_16
        rate: 0.08

      # fal-ai/wan/v2.7/edit-video -- the PROMPT-DRIVEN restyle endpoint.
      # "Your request will cost $0.1 for 720p and $0.15 for 1080p per second of
      # output video." Verified 2026-09-17.
      #
      # WALL-CLOCK seconds, unlike VACE's frames/16 — a different endpoint in
      # the same family billing a different way, which is exactly why the price
      # model carries both units.
      wan_edit_720p:
        unit: video_second
        rate: 0.10
      wan_edit_1080p:
        unit: video_second
        rate: 0.15

      # Kept as a WALL-CLOCK example so the two video units stay visibly
      # distinct and neither backend has to be approximated by the other.
      # Qwen Cloud Wan 3.0: $0.035 per wall-clock second at 480p, 30s max per
      # generation. NOT evaluated; priced so it is refusable rather than
      # unpriced if a future session reaches for it.
      qwen_cloud_wan3_480p:
        unit: video_second
        rate: 0.035

      # Deferred for T16: a 5.06s canary is $0.91, more than everything else
      # combined. Priced here so it is refusable rather than unpriced.
      runway_aleph:
        unit: video_second
        rate: 0.18
    # Hard caps. null = uncapped. `--max-cost-usd` overrides the run cap.
    # The PROJECT cap is SPEC Addendum A3: the per-run cap alone does not stop
    # ten aborted runs at $19 each costing $190.
    max_cost_usd_run: null
    max_cost_usd_project: null

  # fal.ai endpoint selection. Flux Kontext is operator-pinned over
  # SDXL+ControlNet (SPEC Addendum A2): it preserves structure better in one
  # shot, and structure is what the whole scoring stack grades.
  fal:
    model: "fal-ai/flux-pro/kontext"

# --------------------------------------------------------------------------
# Human review pages (SPEC §5). Self-contained HTML, opened via `webbrowser`,
# no web server. These are thresholds, so they live here and not in code.
# --------------------------------------------------------------------------
review:
  # Frames at or below this F land on the flag page as outliers. Defaults to
  # the pass threshold: anything that did not auto-accept deserves human eyes.
  outlier_f_threshold: 0.75
  # SPEC §5: a random audit sample of frames that DID pass, so a run cannot be
  # rubber-stamped by a scorer that is quietly mis-calibrated.
  audit_sample_fraction: 0.02
  # Deterministic sampling: the same run always yields the same audit set, so a
  # review can be reproduced and a second reviewer sees the same cards.
  audit_sample_seed: 20260909
  # A review page beyond this many cards stops being reviewable. Hitting the cap
  # is itself a finding: an incident note is written with the true count rather
  # than the excess being silently dropped.
  max_outlier_cards: 200
  # How long `poll_canary_verdict` waits for a human before giving up.
  canary_timeout_s: 600
  canary_poll_s: 1.0

# --------------------------------------------------------------------------
# T13/A1 — PER-MODE TARGET VECTORS.
#
# The scoring gate is mode-dependent, and this is not a tuning preference:
#
#   surface (Track A, per-frame img2img)
#       Geometry is PRESERVED and the surface is transformed. Structure
#       preservation is the goal, so SSIM 0.72 and LPIPS-edges 0.35 are
#       correct — they are measuring the thing that must not change.
#
#   resynth (Track C, video-native — Wan VACE, Runway Aleph)
#       The model RESYNTHESISES rather than reskins, so a good frame
#       legitimately moves geometry. The surface targets would reject it.
#       But temporal consistency is Track C's entire claim over Track A, so
#       tf_min goes UP, not down: a resynthesis model that flickers has no
#       reason to exist.
#
# `surface` restates the canonical `targets` / `firewalls` numbers above
# EXACTLY. config.py validates that they match, so the restatement cannot
# drift — it exists so Track C can differ, not so the two can diverge.
#
# `max_retries_per_unit` differs by mode for a structural reason (A4): a failed
# FRAME reseeds one frame, a failed CLIP CHUNK reseeds 81-240 frames at once.
# One Track C retry can consume more budget than ten Track A retries, so
# sharing a cap would let a single chunk failure eat the run.
modes:
  surface:
    targets:
      ssim_min: 0.72
      lpips_edges_max: 0.35
      id_min: 0.85
      tf_min: 0.95
    aggregation: block_p95
    max_retries_per_unit: 2
    total_retry_budget_fraction: 0.15
    calibrated: true
    calibration_note: >-
      Restates the canonical Track A targets, which were set by Decisions 1
      and 2 (memory.md D13/D14) and exercised against 11 fixture cases.
      NOTE: those fixtures are deterministic arithmetic, not generative
      output, so finding F4 still applies to the absolute values — T16 is the
      first real datum. Marked calibrated because these numbers have been
      shipping and gating since step 3, not because F4 is resolved.

  resynth:
    # PLACEHOLDERS. Correct SHAPE, no measurement behind them. `calibrated:
    # false` makes a paid run in this mode a REFUSAL, not a gamble.
    targets:
      ssim_min: 0.45
      lpips_edges_max: 0.55
      id_min: 0.80
      # HIGHER than surface, deliberately. Temporal consistency is what Track C
      # is bought for.
      tf_min: 0.97
    aggregation: block_p95
    # One retry per chunk, not two: a chunk retry is 81-240 frames of spend.
    max_retries_per_unit: 1
    # 5%, not 15%: the same fraction of a per-chunk budget authorises far more
    # money than it does per frame.
    total_retry_budget_fraction: 0.05
    calibrated: false
    calibration_note: >-
      NEVER MEASURED. These have the right shape and no evidence. Set them
      from the T16 clip canary (Wan VACE 480p, 3 seconds, ~$0.12) and flip
      calibrated to true in the same commit that records the decision. Until
      then a paid resynth run is refused by
      WeightsConfig.assert_mode_is_spendable.
