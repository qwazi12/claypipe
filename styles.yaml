# ClayPipe — style profiles and render settings (SPEC §2, §6; Rule 25).
# Everything here is versioned config. Nothing in this file may be hardcoded
# in Python. Validated on startup by claypipe/config.py — a bad value is a
# startup crash, not a silent default.
version: 1

render:
  # 9:16 canvas. Panel heights and margins are DERIVED from each source clip's
  # own aspect ratio at render time — see claypipe/pipeline/layout.py and
  # MASTER_PLAN §1.1. There is deliberately no panel_height here: a 16:9 source
  # and a 2.01:1 source need different ones, and the reference clips prove it.
  width: 1080
  height: 1920
  # The caption band between the two panels, as a fraction of canvas height.
  # Measured on the reference clips: 0.0371 (New Girl, 16:9) and 0.0312
  # (Reacher, 2.01:1). One value cannot fit both exactly; 0.037 favours the
  # denser-captioned case, and this is per-title tunable.
  caption_gap_fraction: 0.037
  crf: 18
  pix_fmt: yuv420p
  default_fps: 12
  header_font_size: 54
  caption_font_size: 40
  # First existing path wins. Startup fails loudly if none exist.
  font_candidates:
    - /System/Library/Fonts/Supplemental/Arial Bold.ttf
    - /System/Library/Fonts/Supplemental/Arial.ttf
    - /Library/Fonts/Arial Bold.ttf
    - /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf

output:
  # Where finished runs are written. ClayPipe's contract surface ends here:
  # it produces final_comparison.mp4 in this directory and stops. Anything
  # downstream (uploads, schedulers, distribution) lives in another repo.
  runs_dir: runs

styles:
  clay:
    # Rewritten 2026-09-17 after V7 returned photoreal footage with a colour
    # grade. The previous prompt ended "keep exact same composition, pose,
    # camera angle, framing and colors" — an img2img-era clause where
    # preserving the frame was the point. Under whole-frame v2v it is an
    # instruction to RETURN THE INPUT, which is close to what came back.
    #
    # The preservation clause is DELETED, not softened. Motion and timing come
    # from the control signal, not from the prompt.
    #
    # Two deliberate properties: it describes a MATERIAL AND A PROCESS
    # (thumbprints, tool marks, seams, hand-shaped) rather than a look, and it
    # restyles the WORLD explicitly. R3 needs the environment to convert, and
    # the old prompt never asked for it.
    prompt: >
      claymation stop-motion animation. Every person is a sculpted
      plasticine figurine: hand-modelled head with oversized rounded
      features, simplified stubby fingers, visible thumbprints and
      sculpting-tool marks pressed into the clay, faint seams where the
      limbs join the body, matte clay surface with a soft waxy sheen.
      The entire room is a handmade miniature set — modelled clay walls,
      clay furniture, clay props, painted card and felt textures, every
      edge slightly uneven and asymmetric the way hand-shaped clay is.
      Warm practical lighting on a tabletop set, shallow depth of field,
      subtle stop-motion imperfection.
    negative_prompt: >
      photorealistic, live action, real people, human skin, photograph,
      film still, CGI, 3D render, smooth plastic, glossy toy, video game,
      digital art, flat cartoon, 2D illustration, anime, text, subtitles
    # Prompt adherence. VACE's default is 5; raised because V7 showed the model
    # ignoring the prompt in favour of the input. There is NO control-strength
    # parameter on this endpoint, so this is the only lever on that balance —
    # and it works the opposite way from one: raising pushes toward the prompt.
    guidance_scale: 7.5
    strength: 0.65
    background_color: "#F2C230"
    header_text_color: "#1A1A1A"
  lego:
    prompt: >-
      LEGO minifigure stop-motion, glossy plastic bricks, LEGO movie style,
      brick-built environment, keep exact same composition, pose, camera angle,
      framing and colors
    strength: 0.65
    background_color: "#F2C230"
    header_text_color: "#1A1A1A"
  logo:
    prompt: >-
      flat 2D logo-style motion graphic, bold shapes, brand colors, keep exact
      same composition and framing
    strength: 0.55
    background_color: "#101820"
    header_text_color: "#F2C230"
